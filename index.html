<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>This Life With You — for Blu</title>
<meta name="theme-color" content="#7f9fbe">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#111;color:#fff}body{overflow-x:hidden}.bg{position:fixed;inset:-20px;background:url('cover.jpg') center 64%/cover no-repeat;filter:brightness(.67) saturate(.92);transform:scale(1.04);z-index:-2}.veil{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(15,38,56,.08),rgba(18,21,18,.15) 45%,rgba(15,16,12,.67));z-index:-1}.page{min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:40px 26px calc(46px + env(safe-area-inset-bottom));}.eyebrow{font:500 11px/1.2 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:.82;margin-bottom:12px}.title{font-size:clamp(34px,10vw,54px);line-height:.98;font-weight:400;letter-spacing:-.035em;text-shadow:0 2px 18px rgba(0,0,0,.25);margin:0}.for{font-style:italic;font-size:17px;opacity:.9;margin:12px 0 30px}.note{font:400 14px/1.5 system-ui,sans-serif;opacity:.78;margin-bottom:18px}.listen{appearance:none;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);color:#fff;border-radius:999px;padding:15px 28px;font:600 13px system-ui,sans-serif;letter-spacing:.14em;cursor:pointer}.player{width:min(420px,100%);margin-top:22px;display:none}.player.show{display:block}.controls{display:flex;justify-content:center;align-items:center;gap:22px;margin:10px 0 17px}.play{width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.16);color:white;font-size:21px}.track{font:500 12px system-ui,sans-serif;letter-spacing:.12em;opacity:.84}.barrow{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:9px;font:11px system-ui,sans-serif;opacity:.88}.bar{height:3px;background:rgba(255,255,255,.34);border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:white}.ending{max-width:390px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 1.2s ease,transform 1.2s ease;margin-top:30px}.ending.show{opacity:1;transform:none;pointer-events:auto}.ending .to{font:500 11px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.68}.quote{font-size:24px;line-height:1.35;font-style:italic;margin:14px 0 20px;text-shadow:0 2px 15px rgba(0,0,0,.35)}.replay{border:0;background:none;color:white;text-decoration:underline;text-underline-offset:5px;font:13px system-ui,sans-serif;opacity:.8;cursor:pointer}@media(min-width:700px){.page{justify-content:center}.bg{background-position:center 66%}}
</style></head>
<body><div class="bg"></div><div class="veil"></div>
<main class="page">
  <div class="eyebrow">A little something for you</div>
  <h1 class="title">This Life<br>With You</h1>
  <div class="for">for Blu</div>
  <div class="note" id="note">I made something for you.</div>
  <button class="listen" id="listen">▶&nbsp;&nbsp;LISTEN</button>
  <section class="player" id="player">
    <div class="track">01 · THIS LIFE WITH YOU</div>
    <div class="controls"><button class="play" id="play" aria-label="Play or pause">❚❚</button></div>
    <div class="barrow"><span id="current">0:00</span><div class="bar"><div class="fill" id="fill"></div></div><span id="duration">4:16</span></div>
  </section>
  <section class="ending" id="ending">
    <div class="to">For Blu</div>
    <div class="quote">“I don’t want a perfect life,<br>I just want this life with you.”</div>
    <button class="replay" id="replay">↻ Listen again</button>
  </section>
</main>
<audio id="audio" preload="metadata"><source src="this-life-with-you.mp3" type="audio/mpeg"></audio>
<script>
const a=document.getElementById('audio'), listen=document.getElementById('listen'), player=document.getElementById('player'), play=document.getElementById('play'), fill=document.getElementById('fill'), cur=document.getElementById('current'), dur=document.getElementById('duration'), ending=document.getElementById('ending'), note=document.getElementById('note'), replay=document.getElementById('replay');
const fmt=s=>{if(!isFinite(s))return '0:00';let m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};
a.addEventListener('loadedmetadata',()=>dur.textContent=fmt(a.duration));
listen.onclick=async()=>{listen.style.display='none';note.style.display='none';player.classList.add('show');try{await a.play()}catch(e){};play.textContent=a.paused?'▶':'❚❚'};
play.onclick=()=>{a.paused?a.play():a.pause()};
a.addEventListener('play',()=>play.textContent='❚❚');a.addEventListener('pause',()=>play.textContent='▶');
a.addEventListener('timeupdate',()=>{cur.textContent=fmt(a.currentTime);fill.style.width=((a.currentTime/(a.duration||1))*100)+'%'});
a.addEventListener('ended',()=>{play.textContent='▶';ending.classList.add('show');ending.scrollIntoView({behavior:'smooth',block:'center'})});
replay.onclick=()=>{ending.classList.remove('show');a.currentTime=0;a.play()};
</script></body></html>
